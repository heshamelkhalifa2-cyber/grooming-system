<html lang="en">
<head>

<style>
:root {
  --navy: #1B2A4A;
  --teal: #1D9E75;
  --teal-dark: #0F6E56;
  --red: #E24B4A;
  --red-dark: #A32D2D;
  --amber: #F9A825;
  --blue: #185FA5;
  --bg: #F4F6F9;
  --card: #ffffff;
  --border: #E2E8F0;
  --text: #1A202C;
  --muted: #718096;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
body.rtl { direction: rtl; }

/* TOPBAR */
.topbar { background: var(--navy); color: #fff; padding: 0 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.lang-btn { background: rgba(255,255,255,0.15); border: none; color: #fff; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
.lang-btn:hover { background: rgba(255,255,255,0.25); }
.logout-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.logout-btn:hover { background: rgba(255,255,255,0.2); }

/* LAYOUT */
.page { display: none; }
.page.active { display: block; }
.container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }

/* LOGIN */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); }
.login-box { background: var(--card); border-radius: 14px; border: 1px solid var(--border); padding: 36px 32px; width: 100%; max-width: 380px; }
.login-logo { text-align: center; margin-bottom: 24px; }
.login-logo .paw { font-size: 40px; }
.login-logo h1 { font-size: 20px; font-weight: 700; color: var(--navy); margin-top: 6px; }
.login-logo p { font-size: 13px; color: var(--muted); margin-top: 2px; }

/* FORM */
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
input, select, textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--text); background: #fff; margin-bottom: 14px; transition: border 0.15s; }
input:focus, select:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(29,158,117,0.1); }
textarea { resize: vertical; min-height: 70px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; }
.btn-primary { background: var(--teal); color: #fff; width: 100%; }
.btn-primary:hover { background: var(--teal-dark); }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: var(--red-dark); }
.btn-outline { background: #fff; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg); }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; }
.card-title { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }

/* KPI GRID */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.kpi-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
.kpi-val { font-size: 20px; font-weight: 700; }
.kpi-val.green { color: var(--teal-dark); }
.kpi-val.red { color: var(--red-dark); }
.kpi-val.blue { color: var(--blue); }
.kpi-val.amber { color: #854F0B; }

/* TABS */
.tabs { display: flex; gap: 4px; margin-bottom: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
.tab { flex: 1; padding: 7px 8px; border-radius: 7px; border: none; background: transparent; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.15s; text-align: center; }
.tab.active { background: var(--navy); color: #fff; }
.tab:hover:not(.active) { background: var(--bg); color: var(--text); }

/* TABLE */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: var(--bg); padding: 8px 10px; text-align: left; font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); border-bottom: 1px solid var(--border); }
td { padding: 9px 10px; border-bottom: 1px solid var(--border); color: var(--text); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #F7FAFC; }
body.rtl th, body.rtl td { text-align: right; }

/* BADGES */
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.badge-green { background: #EAF3DE; color: #3B6D11; }
.badge-blue { background: #E6F1FB; color: #185FA5; }
.badge-amber { background: #FAEEDA; color: #854F0B; }
.badge-red { background: #FCEBEB; color: #A32D2D; }
.badge-gray { background: #F1EFE8; color: #5F5E5A; }

/* ALERTS */
.alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
.alert.show { display: block; }
.alert-success { background: #EAF3DE; color: #3B6D11; border: 1px solid #C0DD97; }
.alert-error { background: #FCEBEB; color: #A32D2D; border: 1px solid #F7C1C1; }

/* PRICE PREVIEW */
.price-preview { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.price-box { background: var(--bg); border-radius: 8px; padding: 10px; text-align: center; }
.price-box .label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; margin-bottom: 3px; }
.price-box .val { font-size: 16px; font-weight: 700; }

/* CLIENT HINT */
.client-hint { font-size: 12px; color: var(--teal-dark); background: #EAF3DE; border-radius: 6px; padding: 6px 10px; margin-top: -10px; margin-bottom: 12px; display: none; }

/* GROOMER ROWS */
.grm-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); }
.grm-row:last-child { border-bottom: none; }
.rank-circle { width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* SECTION HEADER */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-header h2 { font-size: 16px; font-weight: 700; color: var(--navy); }

/* FILTER ROW */
.filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.filter-row select { flex: 1; min-width: 120px; margin-bottom: 0; }

/* WEEK BADGE */
.week-tag { background: #E6F1FB; color: #185FA5; border-radius: 5px; padding: 1px 7px; font-size: 11px; font-weight: 600; }

/* EMPTY STATE */
.empty { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }
.empty .icon { font-size: 32px; margin-bottom: 8px; }

/* SPINNER */
.spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* USER LIST */
.user-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); }
.user-item:last-child { border-bottom: none; }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* RESPONSIVE */
@media (max-width: 600px) {
  .tabs { overflow-x: auto; }
  .tab { font-size: 11px; padding: 6px 5px; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .price-preview { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

function t(key){ return T[lang][key] || key; }

function toggleLang(){
  lang = lang==='en'?'ar':'en';
  document.documentElement.lang = lang;
  document.body.classList.toggle('rtl', lang==='ar');
  applyTranslations();
}

function applyTranslations(){
  const el = id => document.getElementById(id);
  if(el('lbl-username')) el('lbl-username').textContent = t('username');
  if(el('lbl-password')) el('lbl-password').textContent = t('password');
  if(el('login-btn')) el('login-btn-text').textContent = t('login');
  if(el('logout-btn')) el('logout-btn').textContent = t('logout');
  if(el('t-new-session')) el('t-new-session').textContent = t('newSession');
  ['date','branch','grm1','grm2','grm3','grm4','grm5','phone','service','qty',
   'unit-price','total','free','charged','visit','notes'].forEach(k=>{
    const el2=document.getElementById('t-'+k.replace('-',''));
    if(el2) el2.textContent=t(k.replace('-',''));
  });
  if(el('t-unitPrice')) el('t-unitPrice').textContent=t('unitPrice');
  if(el('t-total')) el('t-total').textContent=t('total');
  if(el('t-free')) el('t-free').textContent=t('free');
  if(el('t-charged')) el('t-charged').textContent=t('charged');
  if(el('t-save-btn')) el('t-save-btn').textContent=t('saveBtn');

  if(el('tab-records')) el('tab-records').textContent=t('records');
  if(el('tab-commissions')) el('tab-commissions').textContent=t('commissions');
  if(el('tab-clients')) el('tab-clients').textContent=t('clients');
  if(el('tab-users')) el('tab-users').textContent=t('users');

function showAlert(id, msg, type){
  const el=document.getElementById(id);
  el.textContent=msg; el.className=`alert alert-${type} show`;
  setTimeout(()=>el.classList.remove('show'),4000);
}

async function doLogin(){
  const user=document.getElementById('login-user').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!user||!pass){showAlert('login-alert',t('errorFill'),'error');return;}
  const btn=document.getElementById('login-btn');
  btn.innerHTML='<span class="spinner"></span>';
  btn.disabled=true;
  try{
    const {data,error}=await sb.from('users').select('*').eq('username',user).eq('password',pass).single();
    if(error||!data){showAlert('login-alert',t('errorLogin'),'error');}
    else{
      currentUser=data;
      document.getElementById('topbar-user').textContent=(data.name||data.username)+' — '+(data.role==='admin'?'Admin':'Cashier');
      document.getElementById('page-login').classList.remove('active');
      document.getElementById('page-app').classList.add('active');
      if(data.role==='admin'){
        document.getElementById('view-admin').style.display='block';
        initAdminDropdowns();
        await loadAllRecords();
        renderDashboard();
      } else {
        document.getElementById('view-cashier').style.display='block';
        initCashierForm();
      }
    }
  }catch(e){showAlert('login-alert','Connection error. Please try again.','error');}
  btn.innerHTML=`<span id="login-btn-text">${t('login')}</span>`;
  btn.disabled=false;
}

function doLogout(){
  currentUser=null; allRecords=[];
  document.getElementById('page-app').classList.remove('active');
  document.getElementById('page-login').classList.add('active');
  document.getElementById('view-admin').style.display='none';
  document.getElementById('view-cashier').style.display='none';
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
}

function initCashierForm(){
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('f-date').value=today;
  ['f-grm1','f-grm2','f-grm3','f-grm4','f-grm5'].forEach((id,i)=>{

    sel.innerHTML=`<option value="">${first}</option>`;

async function onPhoneInput(){
  calcPrice();
  const phone=document.getElementById('f-phone').value.trim();
  const hint=document.getElementById('client-hint');
  if(!phone){hint.style.display='none';return;}
  const {data}=await sb.from('records').select('charged,date').eq('phone',phone);
  if(data&&data.length>0){
    const totalPaid=data.reduce((s,r)=>s+(r.charged||0),0);
    hint.textContent=`✅ ${lang==='ar'?'عميل موجود':'Existing client'} — ${data.length} ${lang==='ar'?'زيارة':'visits'} — ${t('totalPaid')}: ${totalPaid.toFixed(3)} KD`;
    hint.style.display='block';
  } else {
    hint.textContent=`🆕 ${t('newClient')}`;
    hint.style.display='block';
  }
}

async function calcPrice(){
  const svc=document.getElementById('f-service').value;
  const qty=parseInt(document.getElementById('f-qty').value)||0;
  const phone=document.getElementById('f-phone').value.trim();
  const price=SERVICES[svc]||0;
  const total=price*qty;
  let free=0;
  if(phone&&svc&&qty>0){
    const {data}=await sb.from('records').select('qty').eq('phone',phone).eq('service',svc);
    const prevQty=data?data.reduce((s,r)=>s+r.qty,0):0;
    const thr=svc==='Full Service'?FS_FREE:svc==='Basic Shower'?BS_FREE:0;
    if(thr>0) free=Math.floor((prevQty+qty)/thr)-Math.floor(prevQty/thr);
  }
  const charged=Math.max(0,qty-free)*price;
  document.getElementById('dp-price').textContent=price.toFixed(3)+' KD';
  document.getElementById('dp-total').textContent=total.toFixed(3)+' KD';
  document.getElementById('dp-free').textContent=free;
  document.getElementById('dp-charged').textContent=charged.toFixed(3)+' KD';
}

async function saveRecord(){
  const date=document.getElementById('f-date').value;
  const branch=document.getElementById('f-branch').value;
  const grm1=document.getElementById('f-grm1').value;
  const phone=document.getElementById('f-phone').value.trim();
  const service=document.getElementById('f-service').value;
  const qty=parseInt(document.getElementById('f-qty').value)||0;
  if(!date||!branch||!grm1||!phone||!service||!qty){
    showAlert('cashier-alert',t('errorFill'),'error');return;
  }
  const groomers=[grm1,
    document.getElementById('f-grm2').value,
    document.getElementById('f-grm3').value,
    document.getElementById('f-grm4').value,
    document.getElementById('f-grm5').value
  ].filter(Boolean);
  const price=SERVICES[service]||0;
  const total=price*qty;
  const {data:prev}=await sb.from('records').select('qty').eq('phone',phone).eq('service',service);
  const prevQty=prev?prev.reduce((s,r)=>s+r.qty,0):0;
  const thr=service==='Full Service'?FS_FREE:service==='Basic Shower'?BS_FREE:0;
  const free=thr>0?Math.floor((prevQty+qty)/thr)-Math.floor(prevQty/thr):0;
  const charged=Math.max(0,qty-free)*price;
  const d=new Date(date);
  const day=d.getDate();
  const week=day<=7?'Wk1 (1-7)':day<=15?'Wk2 (8-15)':day<=22?'Wk3 (16-22)':'Wk4 (23-End)';
  const month=d.toLocaleString('en',{month:'long'});
  const {error}=await sb.from('records').insert([{
    date,branch,groomers,phone,service,qty,price,total,
    free_units:free,charged,week,month,
    visit_type:document.getElementById('f-visit').value,
    notes:document.getElementById('f-notes').value,
    recorded_by:currentUser.username
  }]);
  if(error){showAlert('cashier-alert','Error saving. Please try again.','error');return;}
  showAlert('cashier-alert',t('savedOk')+(free>0?` 🎁 ${free} free unit!`:''),'success');
  ['f-phone','f-notes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-service').value='';
  document.getElementById('f-qty').value='1';
  document.getElementById('client-hint').style.display='none';
  ['dp-price','dp-total','dp-charged'].forEach(id=>document.getElementById(id).textContent='0.000 KD');
  document.getElementById('dp-free').textContent='0';
}

function initAdminDropdowns(){
  ['dash-month','rec-month','comm-month'].forEach(id=>{
    const sel=document.getElementById(id);
    if(!sel)return;
    const hasAll=id!=='comm-month';
    sel.innerHTML=(hasAll?`<option value="all">${t('allMonths')}</option>`:'')+
      MONTHS.map(m=>`<option value="${m}">${m}</option>`).join('');
    if(id==='comm-month')sel.value='May';
  });
}

async function loadAllRecords(){
  const {data}=await sb.from('records').select('*').order('created_at',{ascending:false});
  allRecords=data||[];
}

function filterRecords(month,branch){
  return allRecords.filter(r=>{
    const mOk=!month||month==='all'||r.month===month;
    const bOk=!branch||branch==='all'||r.branch===branch;
    return mOk&&bOk;
  });
}

function renderDashboard(){

  const rev=recs.reduce((s,r)=>s+r.total,0);
  const paid=recs.reduce((s,r)=>s+r.charged,0);
  const ani=recs.reduce((s,r)=>s+r.qty,0);
  const ffs=recs.filter(r=>r.service==='Full Service').reduce((s,r)=>s+(r.free_units||0),0);
  const fbs=recs.filter(r=>r.service==='Basic Shower').reduce((s,r)=>s+(r.free_units||0),0);
  const fval=ffs*12.5+fbs*8.5;
  const alrai=recs.filter(r=>r.branch==='AlRai').reduce((s,r)=>s+r.total,0);
  const alq=recs.filter(r=>r.branch==='Aswaq AlQurain').reduce((s,r)=>s+r.total,0);

  document.getElementById('dash-kpis').innerHTML=`
    <div class="kpi"><div class="kpi-label">${t('revenue')}</div><div class="kpi-val green">${rev.toFixed(3)} KD</div></div>
    <div class="kpi"><div class="kpi-label">${t('paid')}</div><div class="kpi-val blue">${paid.toFixed(3)} KD</div></div>
    <div class="kpi"><div class="kpi-label">${t('animals')}</div><div class="kpi-val">${ani}</div></div>
    <div class="kpi"><div class="kpi-label">${t('commission')}</div><div class="kpi-val red">${(rev*COMM).toFixed(3)} KD</div></div>
    <div class="kpi"><div class="kpi-label">${t('freeFS')} / ${t('freeBS')}</div><div class="kpi-val amber">${ffs} / ${fbs}</div></div>
    <div class="kpi"><div class="kpi-label">${t('freeValue')}</div><div class="kpi-val">${fval.toFixed(3)} KD</div></div>`;

  document.getElementById('dash-branches').innerHTML=`
    <div class="grm-row"><span>AlRai</span><span style="font-weight:700;color:var(--teal-dark)">${alrai.toFixed(3)} KD</span></div>
    <div class="grm-row"><span>Aswaq AlQurain</span><span style="font-weight:700;color:var(--blue)">${alq.toFixed(3)} KD</span></div>`;

  const grmData=GROOMERS.map(g=>{
    const gr=recs.filter(r=>r.groomers&&r.groomers.includes(g));
    const gRev=gr.reduce((s,r)=>s+r.total/r.groomers.length,0);
    const gAni=gr.reduce((s,r)=>s+r.qty,0);
    return{g,gRev,gAni};
  }).filter(x=>x.gRev>0).sort((a,b)=>b.gRev-a.gRev);

  const grEl=document.getElementById('dash-groomers');
  grEl.innerHTML=grmData.length?grmData.map((x,i)=>`
    <div class="grm-row">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="rank-circle">${i+1}</div>
        <div>

        </div>
      </div>
      <div style="font-weight:700;color:var(--teal-dark)">${x.gRev.toFixed(3)} KD</div>
    </div>`).join(''):`<div class="empty">${t('noData')}</div>`;

  const mthData=MONTHS.map(m=>{
    const mr=recs.filter(r=>r.month===m);
    const mRev=mr.reduce((s,r)=>s+r.total,0);
    const mPaid=mr.reduce((s,r)=>s+r.charged,0);
    const mAni=mr.reduce((s,r)=>s+r.qty,0);
    return{m,mRev,mPaid,mAni,mComm:mRev*COMM};

  document.getElementById('dash-monthly').innerHTML=`<table>
    <thead><tr><th>${t('date')}</th><th>${t('revenue')}</th><th>${t('paid')}</th><th>${t('animals')}</th><th>${t('commission')}</th></tr></thead>

      <td>${x.mAni}</td>
      <td style="color:var(--red-dark);font-weight:600">${x.mComm.toFixed(3)} KD</td>
    </tr>`).join('')}</tbody>

function renderCommissions(){
  const month=document.getElementById('comm-month').value;
  const recs=allRecords.filter(r=>r.month===month);
  const el=document.getElementById('comm-content');
  if(!recs.length){el.innerHTML=`<div class="empty"><div class="icon">💸</div>${t('noData')}</div>`;return;}
  const WEEKS=['Wk1 (1-7)','Wk2 (8-15)','Wk3 (16-22)','Wk4 (23-End)'];
  const grmTotals=GROOMERS.map(g=>{
    const gr=recs.filter(r=>r.groomers&&r.groomers.includes(g));
    const gRev=gr.reduce((s,r)=>s+r.total/r.groomers.length,0);
    const gAni=gr.reduce((s,r)=>s+r.qty,0);
    return{g,gRev,gAni,gComm:gRev*COMM};
  }).filter(x=>x.gRev>0).sort((a,b)=>b.gRev-a.gRev);
  el.innerHTML=grmTotals.map((x,rank)=>{
    const wkHtml=WEEKS.map((wk,wi)=>{
      const wr=recs.filter(r=>r.week===wk&&r.groomers&&r.groomers.includes(x.g));
      if(!wr.length)return'';
      const wRev=wr.reduce((s,r)=>s+r.total/r.groomers.length,0);
      const wAni=wr.reduce((s,r)=>s+r.qty,0);
      const wLbl=t('weekLabel')[wi]||wk;
      return`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)">
        <span class="week-tag">${wLbl}</span>
        <span style="font-size:12px">${wAni} animals &nbsp; ${wRev.toFixed(3)} KD &nbsp; <b style="color:var(--teal-dark)">comm: ${(wRev*COMM).toFixed(3)} KD</b></span>
      </div>`;
    }).join('');
    return`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="rank-circle">${rank+1}</div>
          <div>
            <div style="font-weight:700">${x.g}</div>
            <div style="font-size:12px;color:var(--muted)">${x.gAni} animals</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;color:var(--muted)">${x.gRev.toFixed(3)} KD</div>
          <div style="font-size:15px;font-weight:700;color:var(--red-dark)">Comm: ${x.gComm.toFixed(3)} KD</div>
        </div>
      </div>
      ${wkHtml}
    </div>`;
  }).join('');
}

async function addUser(){
  const un=document.getElementById('new-username').value.trim();
  const pw=document.getElementById('new-password').value;
  const name=document.getElementById('new-name').value.trim();
  const role=document.getElementById('new-role').value;
  const branch=document.getElementById('new-branch').value;
  if(!un||!pw){showAlert('user-alert',t('errorFill'),'error');return;}
  const {error}=await sb.from('users').insert([{username:un,password:pw,name,role,branch}]);
  if(error){showAlert('user-alert','Username already exists.','error');return;}
  showAlert('user-alert','User added successfully!','success');
  document.getElementById('new-username').value='';
  document.getElementById('new-password').value='';
  document.getElementById('new-name').value='';
  renderUsers();
}

async function deleteUser(id,username){
  if(!confirm(`Delete user "${username}"?`))return;
  await sb.from('users').delete().eq('id',id);
  renderUsers();
}

function switchTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.tab-section').forEach(s=>s.style.display='none');
  document.getElementById('sec-'+tab).style.display='block';
  if(tab==='records')renderRecords();
  else if(tab==='commissions')renderCommissions();
  else if(tab==='clients')renderClients();
  else if(tab==='users')renderUsers();
  else if(tab==='dashboard')renderDashboard();
}

document.getElementById('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('login-user').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
</body>
